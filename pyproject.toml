[project]
name = "aa"
version = "0.1.0"
description = "Auto annotation tool for crowd images"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "fiftyone>=1.0",
    "pycocotools>=2.0.8",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "protobuf>=7.35.1",
    "timm>=1.0.28",
    "clip",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aa"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
